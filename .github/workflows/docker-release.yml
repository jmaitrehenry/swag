name: docker-release

on:
  release:
    types: [published]

env:
  IMAGE: jmaitrehenry/swaggo-swag

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # keyless signing of the attestation
      attestations: write  # store the attestation on GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Release v2.0.0 -> :2.0.0 and :v2 (a v1.x release would get :v1, never overwriting :v2).
          # Pre-releases only get their full version tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
