name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        go: [ '1.26.x', '1.27.x' ]
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    env:
      # Never auto-download a newer toolchain: each matrix entry must test with its own Go.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go }}
      - name: deps
        run:  make deps
      - name: static program analysis
        run: make fmt-check vet
      - name: build
        run: make build
      - name: test
        run: make test
      - name: coverage
        run: bash <(curl -s https://codecov.io/bash)
